<!DOCTYPE html>

    <title>Simon Game</title>
    <link href="./style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <h1>Press Any Key to Start</h1>

        <button class="box blue-box game-btn" id="box-4"></button>
